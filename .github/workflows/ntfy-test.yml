name: ntfy-test
on: push
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          T=dbtest-$RANDOM$RANDOM
          curl -s -o /dev/null -X POST "https://ntfy.sh/$T/keep-me?in=30s" -d "kept"
          curl -s -o /dev/null -X POST "https://ntfy.sh/$T/drop-me?in=30s" -d "dropped"
          curl -s -o /dev/null "https://ntfy.sh/$T/drop-me/delete"
          sleep 50
          echo "== RESULT"; curl -s "https://ntfy.sh/$T/json?poll=1&since=all" | cut -c1-200
