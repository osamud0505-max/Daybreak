name: Notification helper

# Deploys worker/ to Cloudflare so reminders come from Daybreak itself.
# Needs the repository secret CLOUDFLARE_API_TOKEN (and optionally CLOUDFLARE_ACCOUNT_ID).
on:
  push:
    branches: [main]
    paths: ["worker/**", "schedule.js", ".github/workflows/notify-worker.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency: notify-worker

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: npx -y wrangler@4.156.2
    steps:
      - name: Check for the Cloudflare key
        id: key
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set yet, so nothing to deploy."
            echo "ready=no" >> "$GITHUB_OUTPUT"
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.ready == 'yes'
      - uses: actions/setup-node@v4
        if: steps.key.outputs.ready == 'yes'
        with:
          node-version: 22
      - name: Make sure the storage exists
        if: steps.key.outputs.ready == 'yes'
        working-directory: worker
        run: |
          find_id() { $WRANGLER kv namespace list 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s.slice(s.indexOf("[")));const n=j.find(x=>x.title==="daybreak-notify-DAYBREAK"||x.title==="DAYBREAK");process.stdout.write(n?n.id:"")})'; }
          id=$(find_id)
          if [ -z "$id" ]; then $WRANGLER kv namespace create DAYBREAK; id=$(find_id); fi
          if [ -z "$id" ]; then echo "::error::Could not create the storage"; exit 1; fi
          sed -i "s/__KV_ID__/$id/" wrangler.toml
      - name: Make sure the account has a workers.dev address
        if: steps.key.outputs.ready == 'yes'
        run: |
          api() { curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "$@"; }
          acct="$CLOUDFLARE_ACCOUNT_ID"
          if [ -z "$acct" ]; then acct=$(api https://api.cloudflare.com/client/v4/accounts | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write((JSON.parse(s).result||[])[0]?.id||""))'); fi
          if [ -z "$acct" ]; then echo "::error::Could not find the Cloudflare account"; exit 1; fi
          echo "CLOUDFLARE_ACCOUNT_ID=$acct" >> "$GITHUB_ENV"
          have=$(api "https://api.cloudflare.com/client/v4/accounts/$acct/workers/subdomain" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).result?.subdomain||""))')
          if [ -z "$have" ]; then
            name="daybreak-$(openssl rand -hex 3)"
            api -X PUT "https://api.cloudflare.com/client/v4/accounts/$acct/workers/subdomain" -d "{\"subdomain\":\"$name\"}" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.success){console.log("::error::"+JSON.stringify(j.errors));process.exit(1)}console.log("Registered",j.result.subdomain)})'
            sleep 10
          else
            echo "Already has $have.workers.dev"
          fi
      - name: Deploy
        if: steps.key.outputs.ready == 'yes'
        working-directory: worker
        run: |
          $WRANGLER deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$url" ]; then echo "::error::Deployed, but no workers.dev address was printed"; exit 1; fi
          echo "URL=$url" >> "$GITHUB_ENV"
      - name: Tell the app where the helper lives
        if: steps.key.outputs.ready == 'yes'
        run: |
          printf '{ "worker": "%s" }\n' "$URL" > push-config.json
          if ! git diff --quiet -- push-config.json 2>/dev/null || [ -n "$(git status --porcelain push-config.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add push-config.json
            git commit -m "Notification helper address"
            git push
          fi
      - name: Check the helper answers
        if: steps.key.outputs.ready == 'yes'
        run: |
          # A new workers.dev address can take a few minutes to get its certificate.
          for i in $(seq 1 40); do curl -s --fail "$URL/" && break; sleep 15; done
          echo
          curl -sS --fail-with-body "$URL/vapid" | grep -q '"key":"B' && echo "VAPID key OK"
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$URL/subscribe" -H "Content-Type: application/json" -d '{"subscription":{"endpoint":"http://bad","keys":{"p256dh":"x","auth":"y"}}}')
          [ "$code" = 400 ] && echo "Rejects bad subscriptions OK"
